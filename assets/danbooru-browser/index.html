<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>html,body,#root{height:100%;margin:0;overflow:hidden;font-family:'Microsoft YaHei',sans-serif}*{box-sizing:border-box}button,input,select{font:inherit}#root>div{height:100%!important}#root img{object-fit:contain!important}@keyframes refresh-turn{to{transform:rotate(360deg)}}button.refresh-feedback{background:#514875!important}button.refresh-feedback::before{content:'↻';display:inline-block;animation:refresh-turn .7s ease-in-out;margin-right:4px}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#69647f;border-radius:6px}.db-search-controls{display:grid!important;grid-template-columns:minmax(100px,1fr) repeat(5,36px);gap:7px!important;padding:10px!important;flex:0 0 auto!important;min-height:max-content!important;align-items:center}.db-search-controls>input{grid-column:1;grid-row:1;width:100%;min-width:0!important;height:38px;padding:8px 10px!important;font-size:14px!important}.db-search-controls>button{height:38px;width:36px;padding:0!important;font-size:19px!important;align-self:center}.db-search-controls>button:last-child{grid-column:6;grid-row:1}.db-rating-controls{grid-column:1/-1;grid-row:2;display:flex!important;flex-wrap:wrap;gap:5px 12px!important;min-width:0;font-size:13px!important}.db-rating-pair[hidden]{display:none!important}.db-rating-pair{display:inline-flex;align-items:center;gap:5px;min-height:26px;white-space:nowrap}.db-rating-pair input{width:15px;height:15px;margin:0!important}.db-info-strip{flex:0 0 auto!important;min-height:32px!important;max-height:74px!important;padding:6px 10px!important;font-size:12px!important;line-height:1.6!important;overflow:auto}.db-post-grid{flex:1 1 0%!important;min-height:0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;align-items:start}.db-post-grid>div{align-self:start}.db-page-toolbar,.db-statusbar{flex:0 0 auto!important;min-height:28px}.db-page-toolbar{padding:7px!important}.db-page-toolbar button{font-size:12px!important;padding:7px 10px!important}@media(max-width:440px){.db-search-controls{grid-template-columns:minmax(80px,1fr) repeat(5,30px);padding:8px!important;gap:5px!important}.db-search-controls>button{width:30px}.db-rating-controls{gap:3px 9px!important;font-size:12px!important}.db-post-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.db-image-failure{position:absolute;inset:25% 7%;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;background:#16213eee;border-radius:6px;color:#c9c7d5;font-size:12px;line-height:1.5;text-align:center;overflow:auto}.db-image-failure button{border:1px solid #76708f;border-radius:4px;background:#302d49;color:#eee;padding:6px 9px;font-size:12px;cursor:pointer}/* Hide only the settings footer requested by the user; upstream handlers remain intact. */div:has(>a[title="作者B站主页"]){display:none!important}div:has(>div>a[title="作者B站主页"]){justify-content:flex-end!important;gap:8px!important}div:has(>div>a[title="作者B站主页"])>button:nth-of-type(-n+2){display:none!important}</style><div id="root"></div><script>document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&/刷新|更新索引/.test(b.textContent)){b.classList.remove("refresh-feedback");void b.offsetWidth;b.classList.add("refresh-feedback");setTimeout(()=>b.classList.remove("refresh-feedback"),750);}},true);addEventListener("unhandledrejection",()=>{parent.postMessage({type:"danbooru-error"},location.origin);});addEventListener("error",()=>{if(!document.querySelector("#root button"))document.getElementById("root").textContent="浏览器加载失败，请点击上方刷新浏览器。";});</script><script type="module" src="./locale.js"></script><script type="module" src="./danbooru_browser.js"></script></html>
